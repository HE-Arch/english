<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EngForDev · 自动化测试</title>
  <link rel="stylesheet" href="style.css?v=18">
  <style>
    #test-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 340px; background: #1a1a2e; color: #eee; font: 12px/1.5 monospace; z-index: 9999; overflow-y: auto; padding: 10px; box-sizing: border-box; border-left: 1px solid #333; }
    #test-toggle { position: fixed; right: 10px; bottom: 10px; z-index: 10000; background: #58CC02; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
    #test-summary { font-size: 14px; font-weight: 800; margin-bottom: 10px; padding: 8px; background: #222; border-radius: 6px; }
    .t-pass { color: #6fdc6f; }
    .t-fail { color: #ff7a7a; }
    .t-section { color: #ffd166; margin-top: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="app" style="display:none">
    <header class="app-header"><div class="stats"><span id="streak-count">0</span><span id="xp-count">0</span></div></header>
    <main id="main-view">
      <section id="view-home" class="view active"><div class="view-inner"><div id="path-map" class="path-map"></div></div></section>
      <section id="view-learn" class="view">
        <div id="learn-stage" class="learn-stage">
          <div class="step" id="step-goal" hidden><div id="goal-card"></div></div>
          <div class="step" id="step-blocks" hidden><div id="blocks-list"></div></div>
          <div class="step" id="step-grammar" hidden><div id="grammar-card"></div></div>
          <div class="step" id="step-quiz" hidden><div class="quiz-header"><span id="quiz-counter">1</span></div><div id="quiz-body" class="quiz-body"></div><button id="quiz-check">检查</button></div>
          <div class="step" id="step-video" hidden><div id="video-wrap"></div><div id="subtitle-area"></div><div id="shadow-panel" hidden><div id="shadow-target-en"></div><div id="shadow-target-zh"></div><div id="shadow-result" hidden></div></div></div>
          <div class="step" id="step-roleplay" hidden><p id="roleplay-scene"></p><div id="roleplay-log"></div><div id="roleplay-options"></div></div>
          <div class="step" id="step-exam" hidden><div class="quiz-header"><span id="exam-counter">1</span></div><div id="exam-body" class="quiz-body"></div><button id="exam-check">检查</button></div>
          <div class="step" id="step-done" hidden><div id="done-stats"></div></div>
        </div>
      </section>
      <section id="view-review" class="view"><div class="view-inner"><div id="review-wrong" class="review-pane"><div id="wrong-list"></div></div><div id="review-spaced" class="review-pane"><div id="spaced-list"></div></div></div></section>
      <section id="view-video" class="view"><div class="view-inner"><div id="video-list"></div></div></section>
      <section id="view-profile" class="view"><div class="view-inner"><div id="profile-xp">0</div><div id="profile-streak">0</div><div id="profile-chapters">0</div><div id="badge-wall"></div><input id="gemini-api-key"><p id="gemini-status"></p></div></section>
    </main>
    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="home">首页</button>
      <button class="nav-btn" data-view="review">复习</button>
      <button class="nav-btn" data-view="video">视频</button>
      <button class="nav-btn" data-view="profile">我的</button>
    </nav>
    <div id="feedback"><div id="feedback-inner"><div id="feedback-emoji"></div><div id="feedback-text"></div></div></div>
    <div id="toast" hidden></div>
    <div id="word-popup" hidden><div class="word-popup-card"><span id="word-popup-word"></span><div id="word-popup-def"></div></div></div>
  </div>

  <button id="test-toggle" onclick="document.getElementById('test-panel').style.display=(document.getElementById('test-panel').style.display==='none'?'block':'none')">测试面板</button>
  <div id="test-panel">
    <div id="test-summary">运行中…</div>
    <div id="test-list"></div>
  </div>

  <script src="data.js?v=18"></script>
  <script src="app.js?v=18"></script>
  <script>
    (function () {
      const App = window.EngForDev;
      const results = [];
      const list = document.getElementById('test-list');
      const summary = document.getElementById('test-summary');
      function section(name) {
        const h = document.createElement('div');
        h.className = 't-section';
        h.textContent = '—— ' + name + ' ——';
        list.appendChild(h);
      }
      function assert(cond, msg) {
        const pass = !!cond;
        results.push({ pass, msg });
        const line = document.createElement('div');
        line.className = pass ? 't-pass' : 't-fail';
        line.textContent = (pass ? '✅ ' : '❌ ') + msg;
        list.appendChild(line);
        console.log('%c ' + (pass ? 'PASS' : 'FAIL') + ' %c ' + msg,
          'color:' + (pass ? '#58CC02' : '#FF4B4B') + ';font-weight:700;', 'color:#ccc');
      }

      console.log('%c EngForDev 测试开始', 'background:#58CC02;color:#fff;font-weight:700;padding:2px 6px;border-radius:4px;');

      /* ---------- 1. 状态读写 ---------- */
      section('状态读写');
      App.state = App.defaultState();
      App.state.xp = 123; App.state.streak = 7;
      App.saveState(App.state);
      const loaded = App.loadState();
      assert(loaded.xp === 123, '写入 xp=123 后可读回');
      assert(loaded.streak === 7, '写入 streak=7 后可读回');
      assert(Array.isArray(loaded.wrong), '默认 wrong 为数组');
      assert(loaded.currentChapterId === 'ch1', '默认当前章为 ch1');
      assert(loaded.chapterProgress && typeof loaded.chapterProgress === 'object', '含 chapterProgress 字段');
      // 故意写入坏 JSON 验证容错
      localStorage.setItem('engfordev_v1', '{not json');
      const safe = App.loadState();
      assert(safe && typeof safe === 'object' && safe.xp === 0, '坏 JSON 时回退默认状态不抛错');

      /* ---------- 2. 章节自由选择逻辑 ---------- */
      section('章节自由选择逻辑');
      const s2 = App.defaultState();
      const ch1 = App.getChapter('ch1'), ch2 = App.getChapter('ch2'), ch3 = App.getChapter('ch3');
      assert(App.chapterStatus(ch1, s2) === 'available', '默认 ch1 = available');
      assert(App.chapterStatus(ch2, s2) === 'available', '默认 ch2 = available');
      assert(App.isUnlocked(ch1, s2) === true, 'ch1 已解锁');
      assert(App.isUnlocked(ch2, s2) === true, 'ch2 也已解锁（自由选择）');
      App.state = App.defaultState();
      const ok = App.markChapterDone('ch1', 1);
      assert(ok === true, 'markChapterDone(ch1) 返回 true');
      assert(App.state.completed.ch1 != null, 'ch1 写入 completed');
      assert(App.state.xp === App.getChapter('ch1').xp, '完成 ch1 后 XP 增加');
      assert(App.chapterStatus(ch1, App.state) === 'done', 'ch1 状态变 done');
      assert(App.chapterStatus(ch2, App.state) === 'available', 'ch2 仍 available（可自由进入）');
      assert(App.chapterStatus(ch3, App.state) === 'available', 'ch3 也 available');
      const xpBefore = App.state.xp;
      App.markChapterDone('ch1', 1);
      assert(App.state.xp === xpBefore, '重复完成 ch1 不重复加分');

      /* ---------- 3. 题目判分逻辑 ---------- */
      section('题目判分逻辑');
      const ch = App.getChapter('ch1');
      const qChoice = ch.quiz[0];
      assert(App.checkAnswer(qChoice, qChoice.answer).correct === true, '选择题 正确选项判对');
      assert(App.checkAnswer(qChoice, (qChoice.answer + 1) % 4).correct === false, '选择题 错误选项判错');
      const qOrder = ch.quiz.find(x => x.type === 'order');
      assert(App.checkAnswer(qOrder, qOrder.answer).correct === true, '排序题 正确顺序判对');
      assert(App.checkAnswer(qOrder, qOrder.answer.slice().reverse()).correct === false, '排序题 反序判错');
      assert(App.checkAnswer(qOrder, qOrder.answer.slice(0, 2)).correct === false, '排序题 长度不足判错');
      const qFill = ch.quiz.find(x => x.type === 'fill');
      assert(qFill, 'ch1 含填空题');
      assert(App.checkAnswer(qFill, qFill.answer).correct === true, '填空 正确答案判对');
      assert(App.checkAnswer(qFill, '').correct === false, '填空 空串判错');
      const qTrans = ch.quiz.find(x => x.type === 'translation');
      if (qTrans) assert(App.checkAnswer(qTrans, qTrans.answer).correct === true, '翻译题 正确答案判对');
      const qRetell = ch.quiz.find(x => x.type === 'retell');
      if (qRetell) {
        const good = (qRetell.keywords || []).join(' ');
        assert(App.checkAnswer(qRetell, good).correct === true, '复述题 含全部关键词判对');
      }
      assert(App.checkAnswer(null, 'x').correct === false, '空题目不抛错');

      /* ---------- 4. 页面切换 ---------- */
      section('页面切换');
      App.switchView('review');
      assert(document.getElementById('view-review').classList.contains('active'), '切到复习页 active');
      assert(!document.getElementById('view-home').classList.contains('active'), '切走后首页不再 active');
      assert(App.currentView === 'review', 'currentView = review');
      App.switchView('home');
      assert(document.getElementById('view-home').classList.contains('active'), '切回首页 active');
      assert(App.switchView('not-a-view') === false, '非法视图名返回 false');

      /* ---------- 5. 渲染冒烟（章节自由选择列表） ---------- */
      section('渲染冒烟');
      App.renderPathMap();
      const cardCount = document.querySelectorAll('#path-map .chapter-card').length;
      assert(cardCount === 20, '首页渲染 20 个章节卡片（实际 ' + cardCount + '）');
      const stages = document.querySelectorAll('#path-map .stage-label');
      assert(stages.length === 3, '按 A1/A2/B1 三阶段分组');
      assert(!document.querySelector('#path-map .node-circle.locked'), '无锁定节点');
      assert(!!document.querySelector('#path-map .chapter-progress'), '含进度条');
      assert(!!document.querySelector('#path-map .chapter-pct'), '含进度百分比');

      /* ---------- 6. 跟读评分 scoreSentence ---------- */
      section('跟读评分 scoreSentence');
      assert(typeof App.scoreSentence === 'function', 'App.scoreSentence 是函数');
      const sFull = App.scoreSentence('I am a developer', 'I am a developer');
      assert(sFull >= 0.9, '完全一致得分 ≥ 0.9（实际 ' + sFull.toFixed(2) + '）');
      const sZero = App.scoreSentence('I am a developer', 'xyz abc qqq');
      assert(sZero === 0, '完全无关得 0');
      const sHalf = App.scoreSentence('I am a developer from Shanghai', 'I am a designer from Beijing');
      assert(sHalf > 0 && sHalf < 0.9, '部分命中得分在 0~0.9 之间（实际 ' + sHalf.toFixed(2) + '）');

      /* ---------- 7. 学习时长打卡 ---------- */
      section('学习时长打卡');
      assert(typeof App.addStudyTime === 'function', 'App.addStudyTime 是函数');
      App.state = App.defaultState();
      App.addStudyTime(5 * 60 * 1000);
      assert(App.state.lastCheckIn === null, '未达 10 分钟不打卡');
      App.addStudyTime(6 * 60 * 1000);
      assert(App.state.lastCheckIn != null, '累计达 10 分钟后打卡');
      assert(App.state.streak === 1, '首次打卡 streak=1');
      App.addStudyTime(20 * 60 * 1000);
      assert(App.state.streak === 1, '同一天再累计不二次打卡');

      /* ---------- 8. 徽章 ---------- */
      section('徽章系统');
      App.state = App.defaultState();
      App.awardBadges(App.state);
      assert(!App.state.badges.includes('first_step'), 'xp=0 不发 first_step');
      App.state.xp = 10;
      App.awardBadges(App.state);
      assert(App.state.badges.includes('first_step'), 'xp>0 → first_step');
      App.state.shadowCount = 1;
      App.awardBadges(App.state);
      assert(App.state.badges.includes('first_shadow'), 'shadowCount>0 → first_shadow');
      App.state.roleplayCount = 1;
      App.awardBadges(App.state);
      assert(App.state.badges.includes('first_roleplay'), 'roleplayCount>0 → first_roleplay');

      /* ---------- 9. 词义弹窗 ---------- */
      section('词义弹窗');
      App.state = App.defaultState();
      App.saveState(App.state);
      assert(typeof App.showWordPopup === 'function', 'App.showWordPopup 是函数');
      App.showWordPopup('developer', '开发者');
      const popup = document.getElementById('word-popup');
      assert(popup && !popup.hidden, 'showWordPopup 后弹窗显示');
      assert(document.getElementById('word-popup-word').textContent === 'developer', '弹窗词显示正确');
      assert(document.getElementById('word-popup-def').textContent === '开发者', '弹窗释义显示正确');
      App.hideWordPopup();
      assert(popup.hidden === true, 'hideWordPopup 后弹窗隐藏');

      /* ---------- 10. Gemini 安全 ---------- */
      section('Gemini 调用安全');
      assert(typeof App.getApiKey === 'function', 'App.getApiKey 是函数');
      assert(typeof App.setApiKey === 'function', 'App.setApiKey 是函数');
      assert(typeof App.clearApiKey === 'function', 'App.clearApiKey 是函数');
      App.setApiKey('invalid-key-for-test');
      assert(App.getApiKey() === 'invalid-key-for-test', 'setApiKey 后 getApiKey 可读回');
      App.clearApiKey();
      assert(App.getApiKey() === '', 'clearApiKey 后为空');

      /* ---------- 11. 角色扮演渲染 ---------- */
      section('角色扮演渲染');
      const ch1rp = App.getChapter('ch1');
      App.learn.chapter = ch1rp;
      App.renderRoleplayStart(ch1rp);
      const log = document.getElementById('roleplay-log');
      assert(log && log.children.length >= 1, '首句 NPC 台词已渲染');
      const opts = document.getElementById('roleplay-options');
      assert(opts && opts.children.length >= 1, '存在场景选择按钮');

      /* ---------- 12. 语音能力检测 ---------- */
      section('语音能力检测');
      assert(typeof App.supportsSpeech === 'function', 'App.supportsSpeech 是函数');
      const sp = App.supportsSpeech();
      assert(typeof sp === 'boolean', 'supportsSpeech 返回布尔值');

      /* ---------- 13. tap 绑定 ---------- */
      section('tap 绑定');
      assert(typeof App.tap === 'function', 'App.tap 是函数');
      const btn = document.createElement('button');
      document.body.appendChild(btn);
      let tapped = false;
      App.tap(btn, () => { tapped = true; });
      btn.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      assert(tapped === true, 'tap 绑定 pointerdown 能触发回调');
      document.body.removeChild(btn);

      /* ---------- 14. 测验渲染流程 ---------- */
      section('测验渲染流程');
      App.learn.chapter = ch1rp;
      App.learn.quiz = { index: 0, answers: [], wrongs: [] };
      App.renderCurrent('quiz', ch1rp.quiz.length);
      const quizBody = document.getElementById('quiz-body');
      assert(quizBody && quizBody.children.length > 0, 'renderCurrent 后 quiz-body 有内容');

      /* ---------- 15. 全量判分校验 ---------- */
      section('全量判分校验');
      const chapters = ['ch1','ch2','ch3','ch4','ch5','ch6','ch7','ch8','ch9','ch10','ch11','ch12','ch13','ch14','ch15','ch16','ch17','ch18','ch19','ch20'].map(id => App.getChapter(id)).filter(Boolean);
      assert(chapters.length === 20, '共 20 章数据完整');
      let totalQ = 0, totalFail = 0;
      chapters.forEach(ch => {
        [ch.quiz || [], ch.exam || []].forEach(qset => qset.forEach(q => {
          totalQ++;
          let ok = false;
          try {
            if (q.type === 'choice') ok = App.checkAnswer(q, q.answer).correct === true;
            else if (q.type === 'fill' || q.type === 'translation') ok = App.checkAnswer(q, q.answer).correct === true;
            else if (q.type === 'order') ok = App.checkAnswer(q, q.answer.slice()).correct === true;
            else if (q.type === 'retell') {
              const good = (q.keywords || []).join(' ');
              ok = App.checkAnswer(q, good).correct === true;
            }
          } catch (e) { ok = false; console.warn('判分异常', ch.id, q.id, e); }
          if (!ok) { totalFail++; console.warn('判分失败', ch.id, q.id, q.type); }
        }));
      });
      assert(totalFail === 0, '全部 ' + totalQ + ' 题用正确答案判分通过（失败 ' + totalFail + '）');

      /* ---------- 16. 章测去重 + knowledge ---------- */
      section('章测去重');
      function qsig(q) { return q.type + '|' + q.prompt + '|' + JSON.stringify(q.options || q.words || []) + '|' + JSON.stringify(q.answer); }
      chapters.forEach(ch => {
        const qSet = new Set((ch.quiz || []).map(qsig));
        let dup = 0;
        (ch.exam || []).forEach(e => { if (qSet.has(qsig(e))) dup++; });
        const rate = (ch.exam || []).length ? dup / ch.exam.length : 0;
        assert(rate < 0.2, ch.id + ' 章测重复率 ' + Math.round(rate * 100) + '% < 20%');
        const noKn = (ch.exam || []).filter(e => !e.knowledge).length;
        assert(noKn === 0, ch.id + ' 章测全部带 knowledge 标签');
      });

      /* ---------- 17. 开口占比 ---------- */
      section('开口占比');
      chapters.forEach(ch => {
        const shadow = (ch.video && ch.video.cues) ? ch.video.cues.length : 0;
        const rpSpeak = Object.values(ch.roleplay.nodes).filter(n => !n.end && !n.options).length;
        // 分母为输出型练习（quiz+exam+shadow+roleplay），blocks 为词汇输入不计入
        const total = (ch.quiz || []).length + (ch.exam || []).length + shadow + rpSpeak;
        const speakPct = (shadow + rpSpeak) / total;
        assert(speakPct >= 0.4, ch.id + ' 开口占比 ' + Math.round(speakPct * 100) + '% ≥ 40%');
      });

      /* ---------- 18. roleplay 结构 ---------- */
      section('角色扮演结构');
      chapters.forEach(ch => {
        const rp = ch.roleplay;
        assert(rp.start && rp.nodes[rp.start], ch.id + ' roleplay 起始节点存在');
        let endCount = 0, speakCount = 0;
        Object.values(rp.nodes).forEach(n => {
          if (n.end) endCount++;
          if (!n.end && !n.options) { speakCount++; assert(!!n.expected && !!n.next, ch.id + ' 对话节点带 expected+next'); }
        });
        assert(endCount > 0, ch.id + ' 至少一个 end 节点');
        assert(speakCount >= 10, ch.id + ' 开口轮次 ≥ 10（实际 ' + speakCount + '）');
      });

      /* ---------- 19. roleplay 打字降级路径 ---------- */
      section('角色扮演开口路径');
      App.learn.chapter = ch1rp;
      App.renderRoleplayStart(ch1rp);
      const opts2 = document.getElementById('roleplay-options');
      const sceneBtn = opts2.querySelector('button');
      sceneBtn.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      const beforeCnt = App.learn.roleplay.speakCount;
      const curNode0 = ch1rp.roleplay.nodes[App.learn.roleplay.cur];
      App.roleplaySubmitAnswer(curNode0.expected);
      assert(App.learn.roleplay.speakCount === beforeCnt + 1, '正确回答后 speakCount +1');
      const curNode1 = ch1rp.roleplay.nodes[App.learn.roleplay.cur];
      const beforeCnt2 = App.learn.roleplay.speakCount;
      App.roleplaySubmitAnswer('wrong garbage answer xyz');
      assert(App.learn.roleplay.speakCount === beforeCnt2, '错误回答不推进、speakCount 不变');
      App.roleplaySubmitAnswer(curNode1.expected);
      assert(App.learn.roleplay.speakCount === beforeCnt2 + 1, '重试正确后推进');

      /* ---------- 汇总 ---------- */
      const pass = results.filter(r => r.pass).length;
      const fail = results.length - pass;
      summary.textContent = '✅ ' + pass + ' 通过   ❌ ' + fail + ' 失败   共 ' + results.length + ' 项';
      summary.style.color = fail === 0 ? '#6fdc6f' : '#ff7a7a';
      console.log('%c 汇总：通过 ' + pass + ' / ' + results.length + (fail === 0 ? '  全部通过 🎉' : '  有 ' + fail + ' 项失败'),
        'color:' + (fail === 0 ? '#58CC02' : '#FF4B4B') + ';font-weight:700;');
    })();
  </script>
</body>
</html>
